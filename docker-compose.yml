services:
  app:
    image: ${DOCKER_IMAGE_NAME:-tantuyu-url:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tantuyu-url
    restart: on-failure
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - IPINFO_TOKEN=${IPINFO_TOKEN}
      - DATABASE_URL=postgres://postgres:password@postgres:5432/tantuyu
    depends_on:
      - postgres
    command: sh -c "bunx drizzle-kit push && bun server.js"

  postgres:
    image: postgres:17-alpine
    container_name: tantuyu-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tantuyu
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

volumes:
  postgres_data:
